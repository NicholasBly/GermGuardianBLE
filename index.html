<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Guardian</title>
  <link rel="stylesheet" href="./css/icomoon.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="content">
  <div class="wrapper"></div>
</div>
<section id="overlay"></section>
</body>
<script src="./js/jquery-2.1.4.min.js"></script>
<script src="./js/velocity.min.js"></script>
<script src="./js/crypto-js/rollups/md5.js"></script>
<script src="./js/crypto-js/components/enc-base64-min.js"></script>
<script src="./js/hubea-r8533.js"></script>
<script src="./js/aspe.js"></script>
<script src="./js/guardian-opt.js"></script>
<script src="./js/guardian.js"></script>
<script src="./js/activity.js"></script>
<script src="./js/feature.js"></script>
<script src="./js/routes.js"></script>
<!--
<script src="./js/private/hubea_stub.js"></script>
<script src="./js/private/hmac-sha256.js"></script>
<script src="./js/private/enc-base64-min.js"></script>
-->
<script type="text/javascript">
  'use strict';

  /****** TEST ******/
  var _TEST_WITH_HUBEAJS_STUB_ = false;

  if (_TEST_WITH_HUBEAJS_STUB_ && typeof setHubeaStub !== 'undefined') {
      var host = window.location.hostname;
      guardianOpt.hubeaServerUrl = 'http://'+ host +'/bcnapp';
      guardianOpt.guardianServerUrl = 'https://' + host + '/guardian';
      setHubeaStub();

      $.ajaxSetup({
        cache: false
      });
  }
  /****** TEST ******/

  var _guardian = new Guardian(guardianOpt);
  var _targetPurifier;           // 操作対象機器
  var _nearbyPurifiers;          // 周辺で見つかっている登録機器
  var _overlayMonitorTimerId;    // オーバーレイ状態監視タイマ

  $(function() {
    printScenarioId();
    //Guardian初期化
    _guardian.setup(function() {
      getLaunchParams(initialize);
    }, function(err) {
      // インストール直後の初回起動時にオフラインだった場合等
      var title   = 'Startup failed';
      var message = 'Please confirm the network is actually connected to internet.';
      Activity.showDialog({title: title, message: message}, function() {
        window.location.reload();
      });
    });
  });

  function initialize(params) {
    console.debug('initialize:', params);
    // 登録済みデバイスチェック
    getRegisteredDevices(function(devices) {
      devices = devices.filter(function(device) {
        return (device instanceof Purifier);
      });
      if (params.uniqueId) { // デバイス指定あり
        for (var i = 0; i < devices.length; i++) {
          if (devices[i].getUniqueId() == params.uniqueId) {
            _targetPurifier = devices[i];
            break;
          }
        }
      }
      if (_targetPurifier) {
        if (params.alertType) {
          // 交換通知であればActivity起動し自身はダッシュボード画面へ
          var deviceName = _targetPurifier.getDeviceName() || _targetPurifier.getProductName();
          var modelName  = _targetPurifier.getModelName();
          var url = hubea.util.absolutePath('./notification.html') +
                    '#name=' + encodeURIComponent(deviceName) +
                    '&model=' + modelName +
                    '&type=' + params.alertType;
          Activity.launchActivity(url);
          routes.dashboard.top();
        } else {
          // 交換通知を除く機器指定は操作画面へ
          routes.device.control();
        }
      } else
      if (devices.length) {
        // ダッシュボード画面へ
        routes.dashboard.top();
        // 周辺機器状態の更新を開始
        searchNearbyDevices(true);
      } else {
        log('no registered device.');
        if (_guardian.isLoggedIn()) {
          // ログイン済みなら(ゲストモードであっても)ダッシュボード画面へ
          routes.dashboard.top();
        } else {
          routes.startup.top();
        }
      }
    });
  }

  /**
   * オーバーレイ表示状態の変更を通知するコールバックを登録する
   * コールバック引数で状態(オーバーレイ非表示:true / オーバーレイ表示:false)を通知する
   * 登録できるのは常に後勝ち
   */
  function overlayMonitorTimerStart(callback) {
    if (_overlayMonitorTimerId) {
      clearInterval(_overlayMonitorTimerId);
    }
    var $overlay = $('#overlay');
    var state = $overlay.is(':empty');
    _overlayMonitorTimerId = setInterval(function() {
      var next = $overlay.is(':empty');
      if (next != state) {
        log('overlay state changed:' + next);
        state = next;
        doCallback(callback, state);
      }
    }, 300);
  }

  function closeHandler(event) {
    log('closeHandler');
    Activity.closeSelf();
  }

  function jumpRegistration() {
    log('jumpRegistration');
    var registerUrl = hubea.util.absolutePath('./register.html');
    log('launch register with url:' + registerUrl);
    if (Activity.launchActivity(registerUrl)) {
      setPostRegistration();
    } else {
      Activity.fatalExit('hubea.system.activity.start[' + registerUrl + '] failed.');
    }
  }

  //登録画面から復帰した時の自動アクション
  function setPostRegistration() {
    try {
      Activity.addEventListener('onResume', function onResume() {
        log('onResume event.');
        hubea.system.activity.getResult(function(result) {
          if (!result || !result.registeredUniqueId) {
            return;
          }
          // 登録機器状態の更新
          _guardian.refreshCache(function() {
            console.log('refreshCache complete');
            getRegisteredDevice(result.registeredUniqueId, function(device) {
              if (device) {
                _targetPurifier = device;
                routes.device.control();
              }
              // 周辺機器状態の更新を開始(まだ開始されていない場合)
              searchNearbyDevices(true);
            });
          });
        });
      }, true);
    } catch (e) {
      console.error(e);
    }
  }

  function getRegisteredDevice(uniqueId, callback) {
    _guardian.getRegisteredDevices(
      function(devices) {
        devices = devices.filter(function(device) {
          return (device.getUniqueId() == uniqueId);
        });
        if (devices.length) {
          doCallback(callback, devices[0]);
        } else {
          doCallback(callback);
        }
      },
      function(err) {
        log('getRegisteredDevice failed[' + err + ']');
        doCallback(callback);
      }
    );
  }

  function getRegisteredDevices(callback) {
    _guardian.getRegisteredDevices(function(devices) {
      doCallback(callback, devices);
    },
    function(err) {
      doCallback(callback, []);
    });
  }

  function isNearbyDevice(uniqueId) {
    if (!Array.isArray(_nearbyPurifiers)) {
      return false;
    }
    var now = Date.now();
    var num = _nearbyPurifiers.filter(function(device) {
      // 検出後30秒経過したものは除く
      return (device.getUniqueId() == uniqueId && now < (device.jm1.lastReceived + 30000));
    }).length;
    return (0 < num);
  }

  var searchNearbyDevices = (function() {
    var searchTimerId;
    var searchInterval = 1000;
    return function(enable) {
      if (!enable) {
        if (searchTimerId) {
          clearInterval(searchTimerId);
          searchTimerId = null;
        }
        return;
      }
      if (searchTimerId) {
        return;
      }
      var busy = false;
      searchTimerId = setInterval(function() {
        if (busy) {
          return;
        }
        busy = true;
        _guardian.findDevices(function(devices) {
          _nearbyPurifiers = devices.filter(function(device) {
            return (device instanceof Purifier);
          });
          busy = false;
        },
        function(err) {
          // N/A
          busy = false;
        });
      }, searchInterval);
    };
  })();

  /**
   * dialog としてConfirmを表示させる
   * @param message {object} {deviceName : '',subject : '',note : '',ok : '',cancel : ''}
   * @param onSuccess {function}
   * @param onCancel {function}
   */
  var dialogConfirm = (function(message, onSuccess, onCancel) {
    function __appendDialogConfirm(message, dom, onSuccess, onCancel) {
      dom.find('.device-name').text(message.deviceName);
      dom.find('.subject').text(message.subject);
      dom.find('.note').text(message.note);

      var $body = $('body');
      var $content = dom.find('.content');
      var $cancelArea = dom.find('#cancel-area');
      var bodyH = $body.height();
      var duration = 500;
      var closeAction = function() {
        $cancelArea.velocity({'opacity': 0}, duration);
        $content.velocity({top: bodyH}, duration, 'ease-in', function() {
          dom.remove();
        });
      };
      $cancelArea.on('touchstart',function(){
        doCallback(onCancel);
        closeAction();
        return false;
      });
      dom.find('.cancel').html(message.cancel).on('click',function(){
        doCallback(onCancel);
        closeAction();
        return false;
      });
      dom.find('.ok').html(message.ok).on('click',function(){
        doCallback(onSuccess);
        closeAction();
        return false;
      });

      // 一旦画面外へ
      $content.css('margin-bottom', (-1) * bodyH);
      dom.appendTo($body);
      $cancelArea.velocity({'backgroundColor': '#000', 'opacity': 0.3}, duration);
      $content.css('margin-bottom', (-1) * $content.height()).velocity({'margin-bottom': 0}, duration, 'ease-out');
    }
    return function(message, onSuccess, onCancel){
      $.get('./template/dialog-confirm.html', function (html) {
        var dom = $(html);
        __appendDialogConfirm(message, dom, onSuccess, onCancel);
      });
    }
  })();

  /**
   * ページロード時のURLから必要な起動パラメータをチェックして返す
   * @param {Function} callback
   *
   * callback引数のオブジェクトには以下のpropertyが含まれる
   * uniqueId : {string} PurifierのJM1 UniqueId (未指定時はundefined)
   * alertType: {string} 'bulb_*' 'filter_*'
   */
  function getLaunchParams(callback) {
    Activity.getParams(function(params) {
      var result = {};
      if (params) {
        if (params.queryParams) {
          // Remote Push(DirectAccess)ではない時はqueryで渡される
          result.uniqueId = params.queryParams.uniqueid;
        }
        if (params.fragmentParams) {
          var fragments = params.fragmentParams;
          if (fragments['type']) {
            result.alertType = fragments['type'];
          }
          if (fragments['uniqueid']) {
            result.uniqueId = fragments['uniqueid'];
          }
          if (!result.uniqueId && typeof fragments['major'] != 'undefined' && typeof fragments['minor'] != 'undefined') {
            // uniqueId は未指定だが major, minor が指定されていればそれを uniqueId に変換(Remote Push)
            var intId = parseInt(fragments['major'], 10) << 16 | parseInt(fragments['minor'], 10);
            if (intId != 0) {
              result.uniqueId = ("00000000" + intId.toString(16).toUpperCase()).slice(-8);
            }
          }
        }
      }
      doCallback(callback, result);
    });
  }

  function loading(activated) {
    /*
    if (activated) {
      var $overlay = $('<div id="loading-overlay"><div id="loading"><div class="ball"></div><div class="ball1"></div></div></div>');
      $overlay.appendTo('body');
    } else {
      $('#loading-overlay').remove();
    }
    */
    if (activated) {
      if(!$('#loading-overlay').length){
        $('<div id="loading-overlay"><div id="loading"><i class="icon-spinner icon-spin"></i></div></div>').appendTo('body');
      }
    } else {
      $('#loading-overlay').remove();
    }
  }

  function doCallback(callback, args) {
    if (typeof callback == 'function') {
      setTimeout(function() {
        callback.call(null, args);
      }, 0);
    }
  }

  /**
   * ScenarioId出力(確認用)
   */
  function printScenarioId() {
    $._getScenarioId().done(function(scenario) {
      console.warn('------------------- Scenario [' + scenario + '] -------------------');
    });
  }

  function log(message) {
    console.log('[LOG]', message);
  }

</script>
</html>
