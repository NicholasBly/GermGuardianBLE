<html>
<head>
  <meta charset="utf-8">

<div id="content">

<script src="./js/jquery-2.1.4.min.js"></script>

<script src="./js/private/hubea_stub.js"></script>
<script src="./js/private/hmac-sha256.js"></script>
<script src="./js/private/enc-base64-min.js"></script>

<script type="text/javascript">
  'use strict';

  if (typeof setHubeaStub !== 'undefined') {
    setHubeaStub();
    $.ajaxSetup({
      cache: false
    });
  }

  $(function() {
    hubea.ready(initialize);
  });

  function initialize() {
    // デフォルトはAmazon Alexa表示
    // fragmentの指定に応じてGoogle Home画面に切り替える
    Activity.getParams(function(params) {
      console.warn('getParams:', params);
      if (params && params.fragmentParams) {
        var fragments = params.fragmentParams;
        if (fragments.type == 'google') {
          if (fragments.param == 'setup') {
            routes.vcontrol.google_setup();
          } else {
            routes.vcontrol.google_top();
          }
          return;
        } else {
          if (fragments.param == 'setup') {
            routes.vcontrol.alexa_setup();
          } else {
            routes.vcontrol.alexa_top();
          }
          return;
        }
      }
      routes.vcontrol.alexa_top();
    });
  }

  function closeHandler(event) {
    log('closeHandler');
    Activity.closeSelf();
  }

  function log(message) {
    console.log('[LOG]', message);
  }

</script>
</html>
