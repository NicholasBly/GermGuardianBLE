<div id="setting-panel" class="login">
  <div class="header">
    <div class="close-button">
      <span class="icon-cross"></span>
    </div>
    <div class="title">
      <span>Login</span>
    </div>
  </div>
  <div class="content">
    <div class="l-grid-wrapper">
      <div class="l-grid10">
        <div class="row title">
          <span class="label">Log in with Guardian TE</span>
          <span id="password-button" class="value">Forgot password</span>
        </div>
      </div>
      <div class="l-grid10">
        <div class="row">
          <input id="username" type="email" placeholder="email or username">
        </div>
      </div>
      <div class="l-grid10">
        <div class="row">
          <input id="password" type="password" placeholder="password">
        </div>
      </div>
      <div class="l-grid10">
        <div class="row trans">
          <div id="login-button" class="label l-button disabled">
            <span>Log in</span>
          </div>
        </div>
      </div>
      <div class="l-grid10">
        <div class="row trans devider">
          <h1><span>Don't have an account?</span></h1>
        </div>
      </div>
      <div class="l-grid10">
        <div class="row trans">
          <div id="create-button" class="label l-button clear">
            <span>Create account</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
  'use strict';

  var _$panel;
  var _$inputId;
  var _$inputPass;
  var _$buttonLogin;

  $(function() {
    initialize();
  });

  function initialize() {
    _$panel = $('#setting-panel.login');
    _$inputId = $('#username', _$panel).change(validate);
    _$inputPass = $('#password', _$panel).change(validate);
    _$buttonLogin = $('#login-button', _$panel).pressable().click(loginHandler);

    setKeyupHandler(_$inputId, validate);
    setKeyupHandler(_$inputPass, validate);

    // BACK
    $('.close-button', _$panel).click(backHandler);
    $('#create-button', _$panel).pressable().click(createAccountHandler);
    $('#password-button', _$panel).click(passwordHandler);
  }

  function validate() {
    if (_$inputId.val().trim().length && _$inputPass.val().length) {
      _$buttonLogin.removeClass('disabled');
    } else {
      _$buttonLogin.addClass('disabled');
    }
  }

  function setKeyupHandler($input, callback) {
    $input.data('prev', $input.val());
    $input.keyup(function(e) {
      var v = $input.val();
      if ($input.data('prev') != v) {
        $input.data('prev', v);
        callback();
      }
    });
  }

  function backHandler(event) {
    log('backHandler');
    routes.dashboard.login(false);
  }

  function loginHandler(event) {
    log('loginHandler');
    if (_$buttonLogin.hasClass('disabled')) {
      return;
    }
    var username = $('#username').val().trim();
    var password = $('#password').val();
    if (!username || !password) {
      var message = "username can't be blank.";
      if (username) {
        message = "password can't be blank.";
      }
      Activity.showDialog({message: message});
      return;
    }
    loginCommon({username: username, password: password});
  }

  function loginCommon(args) {
    conformMigration(function(accept) {
      if (!accept) {
        return;
      }
      loading(true);
      _guardian.accountLogin(args, function() {
        loading(false);
        routes.dashboard.login(false);
      }, function(err, data) {
        loading(false);
        var title = 'Failed to log in';
        var message = 'Please confirm the network is actually connected to internet.';
        if (err === Guardian.ErrorTypes.CS_ERROR && data == Guardian.ErrorTypes.GS_INVALID_ACCOUNT) {
          message = 'Your username or password is incorrect.';
        }
        Activity.showDialog({title: title, message: message}, function() {
          $('#password').val('').trigger('change');
        });
      });
    })
  }

  function conformMigration(callback) {
    getRegisteredDevices(function(devices) {
      devices = devices.filter(function(device) {
        return (device instanceof Purifier);
      });
      if (devices.length) {
        Activity.showDialog({
          message: 'Once you log in, the devices you have already connected will be transferred to your account management.',
          positive: 'OK',
          negative: 'Cancel login'
        }, function(response) {
          var accept = false;
          if (response && response.result) {
            accept = (response.result === 'positive');
          }
          callback.call(null, accept);
        });
      } else {
        callback.call(null, true);
      }
    });
  }

  function createAccountHandler(event) {
    log('createAccountHandler');
    var url = _guardian.getLinkUrl(Guardian.Link.SIGNUP);
    if (url && Activity.launchActivity(url)) {
      Activity.addEventListener('onResume', function() {
        hubea.system.activity.getResult(function(result) {
          if (!$.isPlainObject(result) || !result.username || !result.password) {
            return;
          }
          loginCommon({username: result.username, password: result.password});
        });
      }, true);
    }
  }

  function passwordHandler(event) {
    log('passwordHandler');
    var url = _guardian.getLinkUrl(Guardian.Link.ACCOUNT_RESET_PASSWORD);
    if (url && Activity.launchActivity(url)) {
      //TODO: afterProc
      //Activity.launchApp(url);
    }
  }

</script>
</html>
