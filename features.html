<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>New Features</title>
  <link rel="stylesheet" href="./css/owl.carousel.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: #73B64C;
    }
    .header #skip-button {
      position: absolute;
      top: 20px;
      right: 10px;
      padding: 1em;
      font-size: 80%;
      line-height: 1;
      text-align: center;
    }
    .header .title {
      padding-top: 1em;
    }
    .header .title span {
      display: block;
    }
    .feature {
      margin: .5em 1em;
      padding: 1em;
      background: #8FC570;
    }
    .feature img {
      display: block;
      width: 100%;
      margin-bottom: 1em;
    }
    .feature p {
      height: 11em;
      font-size: 80%;
      overflow: hidden;
    }
    .footer {
      font-size: medium;
    }
    .l-button.clear {
      color: #73B64C;
      border: none;
    }
    .owl-controls .owl-page span {
      background: #8FC570 !important;
    }
    .owl-controls .owl-page.active span {
      background: #FFFFFF !important;
    }
  </style>
</head>
<body>
<div class="header trans">
  <div id="skip-button">
    <span>Skip</span>
  </div>
  <div class="title">
    <span id="page-title"></span>
  </div>
</div>
<div class="content">
  <div id="features" class="owl-carousel">
    <div class="feature" data-title="Device Management">
      <img src="./img/inst-acc01.png">
      <p>
         Registered information of the device will be saved on your account.
         This is useful when sharing your device with multiple smartphones or when replacing smartphones.
      </p>
    </div>
    <div class="feature" data-title="Voice control">
      <img src="./img/inst-acc02.png">
      <p>
        By coordinating with Amazon Echo and/or Google Home products you will be able control the device with your voice.
      </p>
    </div>
  </div>
</div>
<div class="footer">
  <div class="row">
    <div id="navigation-button" class="label l-button clear">
      <span></span>
    </div>
  </div>
</div>
</body>
<script src="./js/jquery-2.1.4.min.js"></script>
<script src="./js/hubea-r8533.js"></script>
<script src="./js/activity.js"></script>
<script src="./js/owl.carousel.min.js"></script>
<script type="text/javascript">
  'use strict';

  var carousel;

  $(function() {
    initialize();
  });

  function initialize() {
    carousel = $('#features').owlCarousel({
      singleItem: true,
      afterAction: afterAction
    }).data('owlCarousel');

    $('#skip-button').click(closeHandler);
    $('#navigation-button').pressable().click(nextHandler);
  }

  function afterAction() {
    var size  = this.owl.owlItems.length;
    var index = this.owl.currentItem;
    // Title
    var title = $('#features .feature').eq(index).data('title');
    // Button
    var label = 'Next';
    if (index + 1 == size) {
      // end
      label = 'Get Started';
    }
    $('#page-title').text(title);
    $('#navigation-button span').text(label);
  }

  function nextHandler(event) {
    var size  = carousel.owl.owlItems.length;
    var index = carousel.owl.currentItem;
    log('nextHandler:' + index);
    if (index + 1 == size) {
      // end
      Activity.closeSelf();
    } else {
      carousel.next();
    }
  }

  function closeHandler(event) {
    log('closeHandler');
    Activity.closeSelf();
  }

  function log(message) {
    console.log('[LOG]', message);
  }

</script>
</html>
